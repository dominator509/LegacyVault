name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OCR_IMAGE: jbarlow83/ocrmypdf:v17.8.1@sha256:0563a68359fe4e68022974103794a69d5d37270686f99c9030a7667ebbb639d4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.25
          python-version: "3.13"
      - run: sh scripts/install.sh
      - run: sh scripts/generate-local-env.sh
      - run: docker compose up -d --wait
      - run: docker pull "$OCR_IMAGE"
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: sh scripts/lint.sh
      - run: sh scripts/format-check.sh
      - run: sh scripts/typecheck.sh
      - run: sh scripts/test-unit.sh
      - run: sh scripts/test-integration.sh
      - run: sh scripts/test-e2e.sh
      - run: sh scripts/contract-test.sh
      - run: sh scripts/build.sh
      - run: sh scripts/security-check.sh
      - run: sh scripts/dependency-audit.sh
      - run: sh scripts/reality-gate.sh
      - run: sh scripts/smoke-test.sh
      - if: always()
        run: docker compose down
