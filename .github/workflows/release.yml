name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
          python-version: "3.13"
      - run: sh scripts/install.sh
      - run: sh scripts/lint.sh
      - run: sh scripts/format-check.sh
      - run: sh scripts/typecheck.sh
      - run: sh scripts/test-unit.sh
      - run: sh scripts/build.sh
      - run: sh scripts/security-check.sh
      - run: sh scripts/dependency-audit.sh

  release-gate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
          python-version: "3.13"
      - run: sh scripts/install.sh
      - run: sh scripts/generate-local-env.sh
      - name: Materialize protected readiness environment
        run: node scripts/materialize-ci-env.mjs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ESSENTIAL: ${{ vars.STRIPE_PRICE_ESSENTIAL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_STAGING: ${{ vars.FLY_APP_STAGING }}
          FLY_APP_PRODUCTION: ${{ vars.FLY_APP_PRODUCTION }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-v4-flash
          SECURITY_CONTACT: ${{ vars.SECURITY_CONTACT }}
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
          LEGAL_ENTITY_NAME: ${{ vars.LEGAL_ENTITY_NAME }}
          LEGAL_ENTITY_ADDRESS: ${{ vars.LEGAL_ENTITY_ADDRESS }}
      - run: docker compose up -d --wait
      - run: pnpm db:migrate
      - run: sh scripts/production-readiness-check.sh

  build-sign-deploy-staging:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/legacy-vault
      RELEASE_TAG: ${{ inputs.release_tag }}
      IMAGE_BUILD_TAG: ${{ inputs.release_tag }}-${{ github.sha }}-${{ github.run_id }}
      FLY_APP_STAGING: ${{ vars.FLY_APP_STAGING }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate immutable semantic release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release_tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release_tag already exists and cannot be overwritten: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ env.IMAGE_BUILD_TAG }}
      - id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ env.IMAGE_BUILD_TAG }}
      - id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ env.IMAGE_BUILD_TAG }}
      - id: release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: release
          push: true
          tags: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_BUILD_TAG }}
      - name: Sign immutable images
        run: |
          cosign sign --yes "${IMAGE_PREFIX}-api@${{ steps.api.outputs.digest }}"
          cosign sign --yes "${IMAGE_PREFIX}-web@${{ steps.web.outputs.digest }}"
          cosign sign --yes "${IMAGE_PREFIX}-worker@${{ steps.worker.outputs.digest }}"
          cosign sign --yes "${IMAGE_PREFIX}@${{ steps.release.outputs.digest }}"
      - name: Deploy named staging app by digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app "$FLY_APP_STAGING" --config fly.toml --image "${IMAGE_PREFIX}@${{ steps.release.outputs.digest }}" --strategy rolling
      - name: Staging smoke and live-fire
        run: |
          sh scripts/staging-smoke.sh "https://${FLY_APP_STAGING}.fly.dev"
          sh scripts/staging-live-fire.sh "https://${FLY_APP_STAGING}.fly.dev"

  publish-release-tag:
    needs: build-sign-deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish immutable release tag after staging proof
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"
          -f "ref=refs/tags/${RELEASE_TAG}"
          -f "sha=${GITHUB_SHA}"
