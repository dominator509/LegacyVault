name: legacy-vault-local

services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: legacy_vault
      POSTGRES_USER: legacy_app
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?generate .env first}
      LOCAL_TEST_DB_PASSWORD: ${LOCAL_TEST_DB_PASSWORD:?generate .env first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/00-create-test-db.sh:/docker-entrypoint-initdb.d/00-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy_app -d legacy_vault"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.9-alpine3.24
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${LOCAL_REDIS_PASSWORD:?generate .env first}",
      ]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli -a $$LOCAL_REDIS_PASSWORD ping | grep -q PONG",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      LOCAL_REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:?generate .env first}
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LOCAL_S3_ACCESS_KEY:?generate .env first}
      MINIO_ROOT_PASSWORD: ${LOCAL_S3_SECRET_KEY:?generate .env first}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/livez"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.5-debian13-slim@sha256:c730bead5fe766dc0edbac5e389b71fc1403a5d3a35c6af9397ad79a52fdc27a
    ports:
      - "127.0.0.1:13310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  minio-data:
  mailpit-data:
  clamav-data:
