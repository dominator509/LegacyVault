primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"
  target = "release"

[deploy]
  release_command = "pnpm db:migrate"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  LOCAL_ENGINEERING_MODE = "false"
  HOST = "0.0.0.0"
  PORT = "3001"
  LOG_LEVEL = "info"
  API_BASE_URL = "http://127.0.0.1:3001"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 75
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/"
    timeout = "5s"

[processes]
  app = "node scripts/run-release-stack.mjs"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
